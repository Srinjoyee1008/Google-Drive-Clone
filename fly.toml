# fly launch --no-deploy --copy-config ; fly volumes create drive_data --size 10 ; fly secrets set SECRET_KEY=$(openssl rand -hex 32) ; fly deploy
app = "pydrive-CHANGE-ME"
primary_region = "sin"

[build]

[env]
  DATA_DIR = "/data"

[mounts]
  source = "drive_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
